networks:
  news_network:
    driver: bridge

services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports: ["2181:2181"]
    networks: [news_network]

  kafka:
    image: wurstmeister/kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "raw_news:1:1"
    depends_on: [zookeeper]
    networks: [news_network]

  mongo:
    image: mongo:5
    container_name: mongodb
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    networks: [news_network]

  producer:
    build: src/news_stream_recommender/kafka_producer
    depends_on: [kafka]
    env_file: .env
    command: ["poetry", "run", "python", "news_producer.py"]
    networks: [news_network]

  spark:
    build: src/news_stream_recommender/spark_app
    volumes:
      - ./src/news_stream_recommender/spark_app:/app
    depends_on: [kafka, mongo]
    env_file: .env
    restart: on-failure
    command: /opt/spark/bin/spark-submit /app/spark_streaming.py
    networks: [news_network]

  backend:
    build: src/news_stream_recommender/backend
    ports: ["8000:8000"]
    depends_on: [mongo]
    env_file: .env
    command: ["sh", "-c", "poetry add uvicorn && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    networks: [news_network]

  frontend:
    build: src/news_stream_recommender/frontend
    ports: ["8501:8501"]
    depends_on: [backend]
    env_file: .env
    command: ["poetry", "run", "streamlit", "run", "streamlit_app.py"]
    networks: [news_network]

volumes:
  mongo_data:
